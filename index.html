<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookie Rotation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #17231f; --muted: #66746d; --paper: #f8f6ef; --mint: #d8f0df; --green: #1f6f50; --line: #d7ded6; --rose: #a84c3b; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(circle at 88% 5%, #f1d6a5 0 12%, transparent 30%), linear-gradient(135deg, #f8f6ef 0%, #e7f1e6 100%); font-family: "DM Sans", sans-serif; min-height: 100vh; }
    main { max-width: 1080px; margin: 0 auto; padding: 48px 24px 64px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 36px; }
    h1, h2 { font-family: "Space Grotesk", sans-serif; margin: 0; letter-spacing: 0; }
    h1 { font-size: clamp(2.5rem, 7vw, 5.4rem); line-height: .92; max-width: 650px; }
    h1 span { color: var(--green); } header p { max-width: 270px; color: var(--muted); margin: 0 0 4px; line-height: 1.5; }
    .panel { background: rgba(255,255,255,.66); border: 1px solid rgba(215,222,214,.9); padding: 24px; box-shadow: 0 16px 45px rgba(48,72,57,.08); }
    .rotation { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; margin-bottom: 24px; }
    .rotation-main { background: var(--ink); color: #f7f4e9; padding: 28px; min-height: 220px; position: relative; overflow: hidden; }
    .rotation-main:after { content: ""; position: absolute; width: 180px; height: 180px; border: 26px solid #355d4b; border-radius: 50%; right: -45px; bottom: -75px; }
    .eyebrow { text-transform: uppercase; letter-spacing: .11em; font-size: .72rem; font-weight: 700; color: #a9c9ad; }
    .rotation-main h2 { font-size: 2rem; margin: 16px 0 18px; position: relative; z-index: 1; }
    .names { display: flex; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }
    .name-chip { background: var(--mint); color: var(--ink); padding: 9px 14px; font-weight: 700; border-radius: 2px; }
    .controls { display: flex; flex-direction: column; justify-content: space-between; gap: 20px; }
    button { border: 0; cursor: pointer; background: var(--green); color: white; padding: 12px 16px; font: inherit; font-weight: 700; border-radius: 2px; }
    button:hover { background: #185a40; } button.secondary { background: transparent; color: var(--green); border: 1px solid var(--green); } button.danger { background: transparent; color: var(--rose); padding: 7px 0; }
    form { display: flex; gap: 10px; margin-top: 16px; } input { min-width: 0; flex: 1; border: 1px solid var(--line); background: white; padding: 12px; font: inherit; border-radius: 2px; color: var(--ink); }
    label { font-weight: 700; font-size: .9rem; } .table-wrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; margin-top: 18px; min-width: 500px; } th, td { text-align: left; padding: 14px 10px; border-bottom: 1px solid var(--line); } th { color: var(--muted); text-transform: uppercase; font-size: .7rem; letter-spacing: .08em; } td:first-child { font-weight: 700; } .number { font-variant-numeric: tabular-nums; }
    #status { min-height: 1.3em; color: var(--muted); font-size: .9rem; margin: 12px 0 0; } .error { color: var(--rose) !important; } .empty { color: var(--muted); padding: 18px 10px; }
    @media (max-width: 720px) { main { padding: 30px 16px 48px; } header, .rotation { display: block; } header p { margin-top: 18px; } .rotation-main { margin-bottom: 16px; } .panel { padding: 18px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Cookie <span>rotation</span></h1><p>Fair turns, quietly tracked. The two people with the fewest turns go next.</p></header>
    <section class="rotation" aria-labelledby="rotation-title">
      <div class="rotation-main"><div class="eyebrow">This week's pair</div><h2 id="rotation-title">Loading the next bakers...</h2><div class="names" id="selected-names"></div></div>
      <div class="panel controls"><div><h2>Keep it moving</h2><p id="pair-detail">The pair is selected from the shared Firebase list.</p></div><button id="complete-week" type="button" disabled>Mark this week complete</button><button id="scramble" class="secondary" type="button">Scramble shadow values</button><button id="reset-cookie-values" class="secondary" type="button">Reset cookie counts</button></div>
    </section>
    <section class="panel" aria-labelledby="add-title"><h2 id="add-title">Add a member</h2><form id="add-form"><label for="member-name" hidden>Name</label><input id="member-name" name="name" type="text" placeholder="Name" maxlength="80" required><button type="submit">Add</button></form><p id="status" role="status"></p></section>
    <section class="panel" style="margin-top: 24px" aria-labelledby="members-title"><h2 id="members-title">All members</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Cookie turns</th><th>Shadow value</th><th></th></tr></thead><tbody id="members-list"><tr><td class="empty" colspan="4">Loading members...</td></tr></tbody></table></div></section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
